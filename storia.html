

<!-- ABOUT -->

<section id="about" class="section">

    <h2
        data-it="La nostra storia"
        data-en="About us">
        La nostra storia
    </h2>


    <div class="hero5">


        <div class="hero5-viewport">

            <div class="hero5-track">


                <!-- =====================================================
                     MATTEO
                ====================================================== -->

                <div class="timeline-item">

                    <div class="timeline-text">

                        <h3>Matteo</h3>

                        <p
                            data-it="
Classe 1991. Toscano nell'anima… e decisamente anche nell'accento. 
Ha un PhD in Robotica, ufficialmente ottenuto con anni e anni di studio, 
ma tutti sappiamo che in realtà è stato preso con i punti della Coop. 
Dopo aver perso molto tempo e molti capelli dietro alla precedente azienda, 
ha recentemente deciso di cambiare direzione e di dedicarsi allo studio e 
salvaguardia delle risorse idriche del pianeta. Nella vita ha cambiato tante 
città e vissuto esperienze molto diverse, ma c'è una costante: ovunque vada 
riesce sempre a costruire amicizie sincere grazie alla sua genuinità, empatia 
e capacità di far sentire chiunque a proprio agio.

Ama profondamente la sua famiglia e, naturalmente, Eleonora. Nonostante questo, 
Bracco continua a occupare saldamente il primo posto: a testimonianza di questo, 
dopo tutti questi anni lo sfondo del telefono non è cambiato e rimane saldamente 
ancora quello del cane.
"

                            data-en="
Born in 1991. Tuscan through and through... and his accent makes sure no one ever forgets it.

He holds a PhD in Robotics, officially earned through years of hard work and study. 
Though we all know the truth: he probably redeemed it with his Supermarket loyalty points.

After spending far too much time—and losing far too much hair—at his previous company, 
he recently decided to change direction and dedicate himself to protecting one of the planet's most precious resources: water.

Life has taken him to many different cities and given him countless experiences, 
but one thing has always remained the same: wherever he goes, he builds genuine, 
lasting friendships thanks to his authenticity, empathy, and remarkable ability to make everyone feel at ease.

He loves his family deeply and, of course, Eleonora. That said, Bracco still firmly 
holds first place. As proof, after all these years, his phone wallpaper is still a picture of his dog.
">
                            Storia Matteo.
                        </p>

                    </div>


                    <img
                        src="assets/images/matteo.JPG"
                        class="timeline-image"
                        alt="Matteo">

                </div>



                <!-- =====================================================
                     ELEONORA
                ====================================================== -->

                <div class="timeline-item">

                    <div class="timeline-text">

                        <h3>Eleonora</h3>

                        <p
                            data-it="
Classe 1992. Bolognese di nascita, Milanese d'adozione per attitudine e 
atteggiamento alla vita. Cerca disperatamente di sembrare una ragazza elegante 
e raffinata, ma rivela in fretta la sua vera anima di un camionista come apre bocca. 
Ingegnere biomedico, sulla carta insegna ai suoi colleghi di tutto il mondo a utilizzare 
apparecchiature medicali. In verità, passa il tempo a fargli da psicologa e ad organizzare 
giochi improbabili per intrattenerli. Sempre disponibile ad aiutare gli altri e 
il prossimo, nel tempo libero parla, studia francese, balla, parla, mangia, parla 
di nuovo, e poi coltiva con dedizione la sua carriera da ipocondriaca e maniaca del controllo.

Ama tantissimo Matteo, purché ad una certa distanza di sicurezza: il contatto 
fisico non è esattamente il suo linguaggio dell'amore. Se le dessero un euro per 
ogni 'Matteo Basta!' detto al giorno, sarebbe miliardaria.
"

                            data-en="
Born in 1992. Bolognese by birth, Milanese by choice—and especially by attitude.

She tries her very best to come across as elegant and sophisticated, but the 
illusion usually lasts only until she opens her mouth and reveals the soul of a truck driver.

A biomedical engineer, her official job is training healthcare professionals 
around the world on how to use medical equipment. In reality, she spends most 
of her time acting as their therapist and inventing increasingly questionable team-building games to keep them entertained.

Always ready to help others, in her spare time she talks, studies French, dances, 
talks some more, eats, talks again, and diligently nurtures her parallel careers 
as both a hypochondriac and a control freak.

She loves Matteo dearly—as long as he stays at a safe distance. Physical affection 
isn't exactly her love language. If she earned one euro every time she said 'Matteo, 
enough!' in a single day, she'd be a billionaire.
">
                            Storia Eleonora.
                        </p>

                    </div>


                    <img
                        src="assets/images/eleonora.JPG"
                        class="timeline-image"
                        alt="Eleonora">

                </div>



                <!-- =====================================================
                     COME CI SIAMO TROVATI
                ====================================================== -->

                <div class="timeline-item">

                    <div class="timeline-text">

                        <h3
                            data-it="Come ci siamo trovati"
                            data-en="How we met">
                            Come ci siamo trovati
                        </h3>

                        <p
                            data-it="
La nostra storia è iniziata nel 2023 grazie ad alcuni amici che hanno pensato di 
metterci in contatto quando Eleonora ha iniziato a lavorare spesso a Parigi.

L'idea era semplice: Matteo avrebbe dovuto farle conoscere la città e 
consigliarle qualche attività interessante.

Alla fine, invece di presentarle Parigi, ha presentato se stesso. E, con 
il suo irresistibile romanticismo, ha decisamente superato le aspettative.
"

                            data-en="
Our story began in 2023, thanks to a couple of friends who decided to 
introduce us when Eleonora started travelling to Paris regularly for work.

The idea was simple: Matteo would show her around the city and recommend 
a few interesting things to do.

Instead of introducing her to Paris, though, he introduced himself.

And with his irresistible charm and hopelessly romantic ways, he exceeded 
every expectation.
">
                            Trovarsi.
                        </p>

                    </div>


                    <img
                        src="assets/images/trovati.jpeg"
                        class="timeline-image"
                        alt="Eleonora e Matteo">

                </div>



                <!-- =====================================================
                     FOCA & DODO
                ====================================================== -->

                <div class="timeline-item">

                    <div class="timeline-text">

                        <h3>Foca &amp; Dodo</h3>

                        <p
                            data-it="
Avremmo potuto scegliere soprannomi romantici e sdolcinati.

Invece ci chiamiamo Foca e Dodo.

Matteo è una foca: pelato, con dei baffoni importanti e goffo al punto da 
sbattere metaforicamente le pinne ovunque.

Eleonora è un dodo: un animale starnazzante talmente raro e talmente poco
brillante da essere riuscito perfino a estinguersi.

Pensiamo che questo dica già abbastanza su di noi.
"

                            data-en="
We could have chosen sweet, romantic nicknames.

Instead, we call each other Foca (Seal) and Dodo.

Matteo is the seal: bald, proudly sporting an impressive moustache, and 
just clumsy enough to metaphorically slap his flippers into everything.

Eleonora is the dodo: a loud, wonderfully peculiar bird so rare—and 
apparently not particularly bright—that it managed to go extinct.

We think that says quite a lot about us already.
">
                            Foca e Dodo.
                        </p>

                    </div>


                    <img
                        src="assets/images/focaedodo.PNG"
                        class="timeline-image"
                        alt="Foca e Dodo">

                </div>



                <!-- =====================================================
                     DUE COPIE DELLO STESSO DIFETTO
                ====================================================== -->

                <div class="timeline-item">

                    <div class="timeline-text">

                        <h3
                            data-it="Due copie dello stesso difetto"
                            data-en="Two copies of the same flaws">
                            Due copie dello stesso difetto
                        </h3>

                        <p
                            data-it="
Siamo entrambi figli unici.

Siamo entrambi mancini.

E siamo entrambi incredibilmente testardi.

Vi assicuriamo che assistere a una nostra discussione su chi debba 
avere l'ultima parola è uno spettacolo che non consigliamo a nessuno.
"

                            data-en="
We're both only children.

We're both left-handed.

And we're both unbelievably stubborn.

Trust us: watching us argue over who gets the last word is a show 
we wouldn't recommend to anyone.
">
                            Stesso Difetto.
                        </p>

                    </div>


                    <img
                        src="assets/images/fumetto.png"
                        class="timeline-image"
                        alt="Eleonora e Matteo">

                </div>



                <!-- =====================================================
                     IL SEGRETO
                ====================================================== -->

                <div class="timeline-item">

                    <div class="timeline-text">

                        <h3
                            data-it="Il segreto?"
                            data-en="The secret?">
                            Il segreto?
                        </h3>

                        <p
                            data-it="
Se esiste, non l'abbiamo ancora scoperto.

Quello che sappiamo è che non passa giorno senza che ridiamo di gusto, 
spesso per le cose più assurde. Litighiamo, anche parecchio. 
Ci prendiamo in giro senza pietà. Ma ci sosteniamo sempre, 
ci scegliamo ogni giorno e ci amiamo incondizionatamente.

E non c'è nulla che non faremmo l'uno per l'altra.

Siamo davvero felici che siate qui a condividere con noi 
questo giorno così speciale.

Grazie per far parte della nostra storia!
"

                            data-en="
If there is one, we haven't figured it out yet.

What we do know is that not a single day goes by without us laughing-often at 
the most ridiculous things. We argue, sometimes quite spectacularly. 
We tease each other mercilessly. But we always support one another, we 
choose each other every single day, and we love each other unconditionally.

And there is nothing we wouldn't do for each other.

We're so happy you're here to celebrate this special day with us.

Thank you for being part of our story!
">
                            Il Segreto.
                        </p>

                    </div>


                    <img
                        src="assets/images/segreto.JPG"
                        class="timeline-image"
                        alt="Eleonora e Matteo">

                </div>


            </div>

        </div>
